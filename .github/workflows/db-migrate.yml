name: DB Migrate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docker/schema.sql'
      - 'docker/schema/**'
      - 'docker/migrations/**'

concurrency:
  group: db-migrate-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: Generate Migration
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}

    steps:
      # An App token, because pushes made with GITHUB_TOKEN don't trigger CI.
      - name: Create App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DB_BOT_APP_ID }}
          private-key: ${{ secrets.DB_BOT_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate
        id: generate
        run: |
          EXISTING="$(ls docker/migrations/V*__pr"${PR_NUMBER}"_*.sql 2>/dev/null | head -n 1 || true)"

          if [ -n "$EXISTING" ] && head -n 1 "$EXISTING" | grep -q '^-- manual'; then
            echo "$EXISTING is marked -- manual, not regenerating."
            echo "file=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=""
          if [ -n "$EXISTING" ]; then
            VERSION="$(basename "$EXISTING" | sed -E 's/^V([0-9]+)__.*/\1/')"
            rm "$EXISTING"
          fi

          # Keep the version across pushes, unless main has moved past it.
          LATEST="$(ls docker/migrations | sed -E 's/^V([0-9]+)__.*/\1/' | sort -n | tail -n 1)"
          if [ -z "$VERSION" ] || [ "$VERSION" -le "$LATEST" ]; then
            VERSION="$(date -u +%Y%m%d%H%M)"
          fi

          SLUG="$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/_/g; s/^_+|_+$//g' | cut -c1-50)"
          FILE="docker/migrations/V${VERSION}__pr${PR_NUMBER}_${SLUG}.sql"
          scripts/db-diff.sh --out "$FILE"

          if [ -f "$FILE" ]; then
            echo "file=$FILE" >> "$GITHUB_OUTPUT"
          fi

      # Applies the new file and proves it reproduces docker/schema exactly.
      - name: Verify
        run: scripts/db-diff.sh --check

      - name: Commit
        env:
          BOT_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          git add -A docker/migrations
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_NAME@users.noreply.github.com"
          git commit -m "chore(db): generate migration for #$PR_NUMBER"
          git push

      - name: Comment on Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FILE: ${{ steps.generate.outputs.file }}
        run: |
          {
            if [ -n "$FILE" ]; then
              echo "### Migration \`$(basename "$FILE")\`"
              echo
              echo "Please review it, especially for renames (generated as drop + add, which loses data) and backfills. To edit it by hand, add \`-- manual\` as its first line so it stops being regenerated."
              echo
              echo '```sql'
              head -c 55000 "$FILE"
              echo '```'
            else
              echo "### No migration needed"
            fi
          } > comment.md
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file comment.md

  # Forks can't receive pushes or secrets, so their authors generate the file themselves.
  check-fork:
    name: Check Migration (Fork)
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Migrations Match Schema
        run: |
          if ! scripts/db-diff.sh --check > diff.sql; then
            {
              echo "### Missing migration"
              echo "Run \`pnpm db:diff <name>\` and commit the file. Expected:"
              echo '```sql'
              head -c 55000 diff.sql
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
