name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or branch to deploy'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://neiist.tecnico.ulisboa.pt
    env:
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_HOST: ${{ secrets.SSH_HOST }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # Installed before any secret is loaded, without lifecycle scripts.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup SSH
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Configure Known Hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Determine Deploy Ref
        id: deploy_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then REF="$RELEASE_TAG"; else REF="$INPUT_TAG"; fi
          if ! [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid ref: refusing to deploy" >&2
            exit 1
          fi
          echo "REF=$REF" >> "$GITHUB_ENV"

      - name: Next.js Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Open SSH Tunnel to Production Database
        run: |
          ssh -M -S /tmp/ssh_prod_tunnel.sock -f -N \
              -L 5432:127.0.0.1:5432 \
              -o ExitOnForwardFailure=yes \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              "$SSH_USERNAME@$SSH_HOST"

      - name: Build Standalone Release
        env:
          DATABASE_URL: postgresql://neiist_readonly:${{ secrets.PROD_DB_READONLY_PASSWORD }}@127.0.0.1:5432/neiist
          NEXT_PUBLIC_BASE_URL: https://neiist.tecnico.ulisboa.pt
        run: pnpm build

      - name: Close SSH Tunnel
        if: always()
        run: |
          ssh -S /tmp/ssh_prod_tunnel.sock -O exit dummy 2>/dev/null || true

      - name: Package Standalone Artifact
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          tar -czf release.tar.gz -C .next/standalone .

      - name: Upload Artifacts to VPS
        run: |
          rsync -avz --progress \
              release.tar.gz scripts/deploy_prod.sh \
              "$SSH_USERNAME@$SSH_HOST:/home/neiist/"
          ssh "$SSH_USERNAME@$SSH_HOST" \
              "chmod +x /home/neiist/deploy_prod.sh"

      - name: Deploy to Production
        run: |
          ssh "$SSH_USERNAME@$SSH_HOST" \
              "su - neiist -c 'bash ~/deploy_prod.sh $REF /home/neiist/release.tar.gz'"

      - name: Confirm Production Deployment
        run: |
          ssh "$SSH_USERNAME@$SSH_HOST" \
              "su - neiist -c 'export NVM_DIR=\"\$HOME/.nvm\"; [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"; pm2 jlist'" | jq -r '.[] | select(.name=="blue" or .name=="green") | "🌿 " + .name + " → " + .pm2_env.status'
