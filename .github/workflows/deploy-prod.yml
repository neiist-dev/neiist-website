name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or branch to deploy'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://neiist.tecnico.ulisboa.pt

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Configure Known Hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Determine Deploy Ref
        id: deploy_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then REF="$RELEASE_TAG"; else REF="$INPUT_TAG"; fi
          if ! [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid ref: refusing to deploy" >&2
            exit 1
          fi
          echo "REF=$REF" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Next.js Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Open SSH Tunnel to Production Database
        run: |
          ssh -M -S /tmp/ssh_prod_tunnel.sock -f -N \
              -L 5432:127.0.0.1:5432 \
              -o ExitOnForwardFailure=yes \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}

      - name: Build Standalone Release
        env:
          DATABASE_URL: postgresql://neiist_readonly:${{ secrets.PROD_DB_READONLY_PASSWORD }}@127.0.0.1:5432/neiist
          NEXT_PUBLIC_BASE_URL: https://neiist.tecnico.ulisboa.pt
        run: pnpm build

      - name: Close SSH Tunnel
        if: always()
        run: |
          ssh -S /tmp/ssh_prod_tunnel.sock -O exit dummy 2>/dev/null || true

      - name: Package Standalone Artifact
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          tar -czf release.tar.gz -C .next/standalone .

      - name: Upload Artifacts to VPS
        run: |
          rsync -avz --progress \
              release.tar.gz scripts/deploy_prod.sh \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/neiist/
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
              "chmod +x /home/neiist/deploy_prod.sh"

      - name: Deploy to Production
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
              "su - neiist -c 'bash ~/deploy_prod.sh $REF /home/neiist/release.tar.gz'"

      - name: Confirm Production Deployment
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
              "su - neiist -c 'export NVM_DIR=\"\$HOME/.nvm\"; [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"; pm2 jlist'" | jq -r '.[] | select(.name=="blue" or .name=="green") | "🌿 " + .name + " → " + .pm2_env.status'
