name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or branch to deploy'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://neiist.tecnico.ulisboa.pt

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Determine Deploy Ref
        id: deploy_ref
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "REF=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          else
            echo "REF=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Next.js Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Open SSH Tunnel to Production Database
        run: |
          ssh -f -N -L 5432:127.0.0.1:5432 \
              -o StrictHostKeyChecking=no \
              -o ExitOnForwardFailure=yes \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}

      - name: Build Standalone Release
        env:
          DATABASE_URL: postgresql://neiist_readonly:${{ secrets.PROD_DB_READONLY_PASSWORD }}@127.0.0.1:5432/neiist
          NEXT_PUBLIC_BASE_URL: https://neiist.tecnico.ulisboa.pt
        run: pnpm build

      - name: Close SSH Tunnel
        if: always()
        run: |
          pkill -f "ssh -f -N -L 5432:127.0.0.1" || true

      - name: Package Standalone Artifact
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          tar -czf release.tar.gz -C .next/standalone .

      - name: Upload Artifacts to VPS
        run: |
          scp -o StrictHostKeyChecking=no release.tar.gz scripts/deploy_prod.sh \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/neiist/
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
              "chmod +x /home/neiist/deploy_prod.sh"

      - name: Deploy to Production
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
           "su - neiist -c 'bash ~/deploy_prod.sh ${{ env.REF }} /home/neiist/release.tar.gz'"

      - name: Confirm Production Deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
          "su - neiist -c 'bash -lc \"pm2 jlist\"'" | jq -r '.[] | select(.name=="blue" or .name=="green") | "🌿 " + .name + " → " + .pm2_env.status'
