# The history table lives in its own schema so it never shows up in schema diffs of `neiist`.
flyway.defaultSchema=flyway
flyway.schemas=flyway
flyway.locations=filesystem:/flyway/project/migrations
# Generated plans can create a function before an object its body references.
flyway.initSql=SET check_function_bodies = off
# Function bodies may legitimately contain ${...}.
flyway.placeholderReplacement=false
# A migration from a long-lived branch may merge after a newer one was already applied.
flyway.outOfOrder=true
# Generated plans can mix CONCURRENTLY index statements with transactional DDL.
flyway.mixed=true
# The default transactional lock is an open transaction that CREATE INDEX CONCURRENTLY would wait on forever.
flyway.postgresql.transactional.lock=false
# Validation allows migrations not applied yet, and ones newer than the checkout so an older release can be redeployed.
flyway.ignoreMigrationPatterns=*:pending,*:future
